<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Implemented UI Review Studio · Self-contained Sample</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #68738a;
      --line: #dce2ec;
      --soft: #f4f6fa;
      --paper: #ffffff;
      --canvas: #e9edf4;
      --nav: #17233a;
      --nav-soft: #25334f;
      --brand: #177a6d;
      --brand-soft: #e2f4ef;
      --blue: #3d6bea;
      --blue-soft: #e9efff;
      --warn: #b86813;
      --warn-soft: #fff1dc;
      --danger: #b83c4a;
      --danger-soft: #fee8eb;
      --ok: #217a52;
      --ok-soft: #e3f5eb;
      --shadow: 0 18px 45px rgba(29, 40, 64, 0.13);
      --radius-lg: 22px;
      --radius-md: 14px;
      --radius-sm: 10px;
      font-family: Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; background: var(--canvas); }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 0%, rgba(61, 107, 234, 0.09), transparent 28rem),
        var(--canvas);
    }

    button, input, select { font: inherit; }

    button { color: inherit; }

    button:focus-visible, a:focus-visible {
      outline: 3px solid rgba(61, 107, 234, 0.45);
      outline-offset: 2px;
    }

    .skip-link {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 100;
      padding: 10px 14px;
      color: #fff;
      background: #111827;
      border-radius: 8px;
      transform: translateY(-160%);
    }

    .skip-link:focus { transform: translateY(0); }

    .topbar {
      min-height: 72px;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: #fff;
      background: linear-gradient(110deg, #111b2e, #1f3152);
      border-bottom: 1px solid rgba(255,255,255,0.09);
    }

    .brand-lockup { display: flex; align-items: center; gap: 12px; }

    .brand-mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 13px;
      font-weight: 850;
      background: linear-gradient(145deg, #33a995, #3874e7);
      box-shadow: inset 0 1px rgba(255,255,255,0.35);
    }

    .brand-copy strong { display: block; font-size: 15px; letter-spacing: -0.01em; }
    .brand-copy span { display: block; margin-top: 3px; color: #b9c4d8; font-size: 12px; }
    .top-meta { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }

    .meta-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      padding: 5px 10px;
      color: #dce7f8;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      font-size: 11px;
      font-weight: 720;
    }

    .studio {
      min-height: calc(100vh - 72px);
      display: grid;
      grid-template-columns: 248px minmax(580px, 1fr) 312px;
    }

    .review-nav, .evidence-panel { background: var(--paper); }
    .review-nav { border-right: 1px solid var(--line); }
    .evidence-panel { border-left: 1px solid var(--line); }

    .panel-sticky {
      position: sticky;
      top: 0;
      max-height: calc(100vh - 72px);
      overflow: auto;
      padding: 18px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--brand);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 5px; font-size: 17px; letter-spacing: -0.025em; }
    h2 { margin-bottom: 6px; font-size: 16px; letter-spacing: -0.02em; }
    h3 { margin-bottom: 8px; font-size: 13px; }
    .subtle { color: var(--muted); font-size: 12px; line-height: 1.55; }

    .progress-card {
      margin: 15px 0 18px;
      padding: 13px;
      border: 1px solid #cfe7df;
      border-radius: var(--radius-md);
      background: linear-gradient(145deg, #f7fffc, var(--brand-soft));
    }

    .progress-line { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .progress-line strong { font-size: 19px; }
    .progress-line span { color: var(--muted); font-size: 10px; font-weight: 750; }

    .progress-track {
      height: 7px;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(23, 122, 109, 0.15);
    }

    .progress-track i { display: block; width: 72%; height: 100%; background: var(--brand); border-radius: inherit; }

    .unit-list { display: grid; gap: 7px; }

    .unit-button {
      width: 100%;
      min-height: 52px;
      padding: 9px 10px;
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      text-align: left;
      border: 1px solid transparent;
      border-radius: 11px;
      background: transparent;
      cursor: pointer;
    }

    .unit-button:hover { background: var(--soft); }
    .unit-button[aria-pressed="true"] { border-color: #bfd8d1; background: var(--brand-soft); }

    .unit-number {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: #607087;
      background: #edf1f6;
      font-size: 10px;
      font-weight: 850;
    }

    .unit-button[aria-pressed="true"] .unit-number { color: #fff; background: var(--brand); }
    .unit-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 760; }
    .status-dot { width: 8px; height: 8px; border-radius: 99px; background: #b5becd; }
    .status-dot.confirmed { background: var(--ok); }
    .status-dot.reviewing { background: var(--warn); box-shadow: 0 0 0 4px var(--warn-soft); }

    .legend { margin-top: 18px; padding-top: 15px; border-top: 1px solid var(--line); }
    .legend-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; color: var(--muted); font-size: 10px; }

    .workspace { min-width: 0; padding: 18px; }

    .control-deck {
      margin-bottom: 15px;
      padding: 13px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: rgba(255,255,255,0.92);
      box-shadow: 0 8px 20px rgba(29,40,64,0.06);
    }

    .control-cluster { min-width: 0; }
    .control-label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 9px; font-weight: 850; letter-spacing: 0.08em; text-transform: uppercase; }
    .segmented { display: flex; flex-wrap: wrap; gap: 5px; }

    .segment-button {
      min-height: 32px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      font-size: 10px;
      font-weight: 760;
      cursor: pointer;
    }

    .segment-button:hover { border-color: #aeb8ca; }
    .segment-button[aria-pressed="true"] { color: #fff; border-color: var(--blue); background: var(--blue); }

    .state-note {
      min-height: 34px;
      margin-bottom: 12px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #665019;
      border: 1px solid #efd69b;
      border-radius: 10px;
      background: #fff8e7;
      font-size: 11px;
    }

    .state-note[hidden] { display: none; }

    .preview-stage {
      min-height: 660px;
      padding: 18px;
      display: grid;
      place-items: start center;
      overflow: auto;
      border: 1px solid #cfd6e2;
      border-radius: var(--radius-lg);
      background:
        linear-gradient(45deg, rgba(255,255,255,0.36) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(255,255,255,0.36) 25%, transparent 25%),
        #dfe4ec;
      background-size: 24px 24px;
      box-shadow: inset 0 1px 3px rgba(35,45,68,0.08);
    }

    .preview-frame {
      width: min(100%, 1040px);
      overflow: hidden;
      border: 1px solid #c7ceda;
      border-radius: 18px;
      background: #f8f9fb;
      box-shadow: var(--shadow);
    }

    .preview-frame.mobile-frame { width: min(100%, 390px); border-radius: 28px; }
    .preview-browser { height: 34px; padding: 0 12px; display: flex; align-items: center; gap: 6px; color: #7f8898; background: #f1f3f6; border-bottom: 1px solid #d9dee7; font-size: 9px; }
    .browser-dot { width: 7px; height: 7px; border-radius: 50%; background: #c2c8d2; }
    .preview-browser span:last-child { margin-left: 7px; }

    .product-shell { min-height: 592px; display: grid; grid-template-columns: 190px minmax(0, 1fr); background: #f6f7fa; }
    .product-sidebar { padding: 18px 14px; color: #e8edf8; background: var(--nav); }
    .product-logo { display: flex; align-items: center; gap: 8px; margin-bottom: 19px; font-size: 12px; font-weight: 850; }
    .product-logo i { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 9px; background: linear-gradient(145deg, #2f9b89, #4b70e3); font-style: normal; }

    .product-stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 15px; }
    .mini-stat { padding: 8px 6px; border-radius: 9px; background: var(--nav-soft); }
    .mini-stat span { display: block; color: #9eadc4; font-size: 7px; }
    .mini-stat strong { display: block; margin-top: 3px; font-size: 13px; }

    .product-search { padding: 8px 9px; color: #9daac0; border: 1px solid #35435e; border-radius: 8px; background: #202d47; font-size: 8px; }
    .workspace-cards { display: grid; gap: 7px; margin-top: 10px; }
    .workspace-card { padding: 9px; border: 1px solid transparent; border-radius: 9px; background: rgba(255,255,255,0.055); }
    .workspace-card.active { border-color: rgba(91,197,172,0.55); background: rgba(58,168,143,0.16); }
    .workspace-card strong { display: block; font-size: 9px; }
    .workspace-card span { display: block; margin-top: 4px; color: #9eadc4; font-size: 7px; line-height: 1.35; }

    .product-main { min-width: 0; }
    .product-header { min-height: 56px; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #fff; border-bottom: 1px solid #e0e4eb; }
    .product-header strong { display: block; font-size: 12px; }
    .product-header small { color: #7e8898; font-size: 8px; }
    .product-actions { display: flex; gap: 6px; }
    .tiny-action { padding: 6px 8px; border: 1px solid #d8dde7; border-radius: 7px; background: #fff; font-size: 8px; font-weight: 740; }
    .tiny-action.primary { color: #fff; border-color: var(--brand); background: var(--brand); }

    .product-content { padding: 14px 16px 18px; }
    .summary-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; }
    .summary-card { min-width: 0; padding: 10px; border: 1px solid #e1e5ec; border-radius: 10px; background: #fff; }
    .summary-card span { display: block; color: #7d8798; font-size: 7px; }
    .summary-card strong { display: block; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
    .summary-card.attention { border-color: #f0d2a3; background: #fffaf2; }

    .detail-strip { margin-top: 9px; padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(340px, 1fr); gap: 12px; border: 1px solid #e0e4eb; border-radius: 11px; background: #fff; }
    .store-identity strong { display: block; font-size: 12px; }
    .store-identity span { display: block; margin-top: 4px; color: #7b8493; font-size: 8px; }
    .status-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
    .status-cell { padding-left: 9px; border-left: 1px solid #e2e6ed; }
    .status-cell span { display: block; color: #8a93a2; font-size: 7px; }
    .status-cell strong { display: block; margin-top: 3px; font-size: 9px; }

    .task-card { margin-top: 9px; overflow: hidden; border: 1px solid #dde2ea; border-radius: 11px; background: #fff; }
    .task-tabs { min-height: 39px; padding: 0 11px; display: flex; align-items: flex-end; gap: 3px; overflow-x: auto; border-bottom: 1px solid #e3e7ed; }
    .task-tab { min-width: max-content; padding: 10px 9px 8px; color: #707b8d; border-bottom: 2px solid transparent; font-size: 8px; font-weight: 750; }
    .task-tab.active { color: var(--brand); border-bottom-color: var(--brand); }
    .task-toolbar { padding: 9px 11px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #fbfcfd; border-bottom: 1px solid #edf0f4; }
    .task-toolbar strong { font-size: 9px; }
    .filter-pills { display: flex; flex-wrap: wrap; gap: 4px; }
    .filter-pill { padding: 4px 6px; border: 1px solid #dce1e9; border-radius: 99px; color: #707a8a; background: #fff; font-size: 7px; }
    .filter-pill.active { color: #fff; border-color: var(--blue); background: var(--blue); }

    .content-list { display: grid; }
    .content-row { padding: 10px 11px; display: grid; grid-template-columns: 24px 90px minmax(0, 1fr) 70px; align-items: start; gap: 9px; border-bottom: 1px solid #edf0f4; }
    .content-row:last-child { border-bottom: 0; }
    .content-check { width: 15px; height: 15px; border: 1px solid #c9d0dc; border-radius: 4px; }
    .content-author strong { display: block; font-size: 8px; }
    .content-author span { display: block; margin-top: 3px; color: #8a93a2; font-size: 7px; }
    .content-copy { min-width: 0; font-size: 8px; line-height: 1.45; }
    .content-meta { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 3px; }
    .micro-chip { padding: 3px 5px; border-radius: 99px; color: #5f6b7e; background: #edf1f6; font-size: 6px; font-weight: 720; }
    .micro-chip.best { color: #8a5612; background: #fff0cf; }
    .micro-chip.media { color: #365fbd; background: #e8efff; }
    .micro-chip.offline { color: #9c3440; background: #fee8eb; }

    .proposal-highlight { position: relative; box-shadow: 0 0 0 2px rgba(61,107,234,0.55); }
    .proposal-highlight::after { content: "D-014"; position: absolute; top: -8px; right: 7px; padding: 3px 5px; color: #fff; border-radius: 5px; background: var(--blue); font-size: 6px; font-weight: 850; }

    .mobile-product { min-height: 720px; background: #f7f8fa; }
    .mobile-header { position: relative; min-height: 55px; padding: 10px 12px; display: flex; align-items: center; gap: 9px; color: #fff; background: var(--nav); }
    .hamburger { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,0.18); border-radius: 9px; background: rgba(255,255,255,0.06); }
    .mobile-header strong { display: block; font-size: 11px; }
    .mobile-header span { display: block; margin-top: 2px; color: #aebbd0; font-size: 7px; }
    .mobile-body { padding: 11px; }
    .mobile-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .mobile-metric { padding: 9px; border: 1px solid #e0e4eb; border-radius: 10px; background: #fff; }
    .mobile-metric span { display: block; color: #828c9c; font-size: 7px; }
    .mobile-metric strong { display: block; margin-top: 3px; font-size: 12px; }
    .mobile-detail { margin-top: 7px; padding: 11px; border: 1px solid #dfe4ec; border-radius: 11px; background: #fff; }
    .mobile-detail strong { display: block; font-size: 11px; }
    .mobile-detail span { display: block; margin-top: 4px; color: #7c8696; font-size: 8px; }
    .mobile-status { margin-top: 9px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; }
    .mobile-status div { padding: 8px; border-radius: 8px; background: #f2f4f7; }
    .mobile-status small { display: block; color: #7c8696; font-size: 6px; }
    .mobile-status b { display: block; margin-top: 3px; font-size: 8px; }
    .mobile-tabs { margin-top: 8px; padding: 5px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; border: 1px solid #e0e4eb; border-radius: 10px; background: #fff; }
    .mobile-tab { padding: 6px 2px; text-align: center; border-radius: 7px; color: #758093; font-size: 7px; font-weight: 720; }
    .mobile-tab.active { color: #fff; background: var(--brand); }
    .mobile-filter { margin-top: 7px; padding: 9px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #e0e4eb; border-radius: 9px; background: #fff; font-size: 8px; font-weight: 750; }
    .mobile-review-list { max-height: 280px; margin-top: 7px; overflow: auto; border: 1px solid #e0e4eb; border-radius: 10px; background: #fff; }
    .mobile-review { padding: 10px; border-bottom: 1px solid #edf0f4; }
    .mobile-review:last-child { border-bottom: 0; }
    .mobile-review-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .mobile-review-head strong { font-size: 8px; }
    .mobile-review-head span { color: #8a93a2; font-size: 7px; }
    .mobile-review p { margin: 7px 0 0; font-size: 8px; line-height: 1.5; }
    .mobile-pagination { margin-top: 7px; padding: 8px; display: flex; align-items: center; justify-content: center; gap: 5px; border: 1px solid #e0e4eb; border-radius: 9px; background: #fff; }
    .page-dot { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 6px; color: #748094; background: #edf1f6; font-size: 7px; }
    .page-dot.active { color: #fff; background: var(--blue); }

    .comparison-grid { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .compare-card { min-width: 0; overflow: hidden; border: 1px solid #cbd3df; border-radius: 16px; background: #fff; box-shadow: 0 12px 28px rgba(29,40,64,0.1); }
    .compare-head { padding: 11px 13px; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid #e1e5eb; }
    .compare-head strong { font-size: 11px; }
    .compare-mini { padding: 14px; background: #f6f7fa; }
    .compare-shell { overflow: hidden; border: 1px solid #e0e4eb; border-radius: 10px; background: #fff; }
    .compare-bar { height: 34px; background: var(--nav); }
    .compare-content { padding: 10px; }
    .skeleton-line { height: 8px; margin-bottom: 6px; border-radius: 99px; background: #e6eaf0; }
    .skeleton-line.short { width: 54%; }
    .compare-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin: 10px 0; }
    .compare-metrics div { min-height: 46px; padding: 7px; border: 1px solid #e1e5ec; border-radius: 8px; background: #fff; }
    .compare-metrics.proposed div:last-child { border-color: #a9c0ff; background: var(--blue-soft); }
    .change-list { padding: 10px 13px 13px; }
    .change-row { margin-top: 7px; padding: 8px; display: grid; grid-template-columns: 44px 1fr; gap: 7px; border-radius: 8px; background: #f4f6f9; font-size: 8px; line-height: 1.45; }
    .change-row b { color: var(--blue); }

    .final-layout { width: 100%; display: grid; gap: 12px; }
    .final-hero { padding: 16px 17px; display: flex; align-items: center; justify-content: space-between; gap: 14px; color: #fff; border-radius: 16px; background: linear-gradient(120deg, #17233a, #254c67 58%, #177a6d); box-shadow: var(--shadow); }
    .final-hero h2 { margin-bottom: 5px; font-size: 17px; }
    .final-hero p { margin: 0; color: #c7d5e5; font-size: 9px; }
    .final-score { min-width: 98px; padding: 11px; text-align: center; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; background: rgba(255,255,255,0.08); }
    .final-score strong { display: block; font-size: 20px; }
    .final-score span { display: block; margin-top: 3px; color: #c8d5e6; font-size: 7px; }
    .final-panels { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(260px, 0.65fr); gap: 12px; }
    .final-panel { overflow: hidden; border: 1px solid #d5dbe5; border-radius: 14px; background: #fff; box-shadow: 0 8px 22px rgba(29,40,64,0.07); }
    .final-panel-head { padding: 11px 13px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e5e8ee; }
    .final-panel-head strong { font-size: 10px; }
    .coverage-table { width: 100%; border-collapse: collapse; font-size: 8px; }
    .coverage-table th, .coverage-table td { padding: 9px 11px; text-align: left; border-bottom: 1px solid #edf0f4; }
    .coverage-table th { color: #727d8e; background: #fafbfc; font-size: 7px; }
    .coverage-table tr:last-child td { border-bottom: 0; }
    .status-pill { display: inline-flex; padding: 3px 6px; border-radius: 99px; font-size: 6px; font-weight: 820; }
    .status-pill.match { color: var(--ok); background: var(--ok-soft); }
    .status-pill.approved-change { color: #365fbd; background: var(--blue-soft); }
    .status-pill.missing { color: var(--danger); background: var(--danger-soft); }
    .parity-list { padding: 10px 12px 13px; display: grid; gap: 7px; }
    .parity-item { padding: 9px; border: 1px solid #e2e6ec; border-radius: 9px; }
    .parity-item div { display: flex; justify-content: space-between; gap: 8px; }
    .parity-item strong { font-size: 8px; }
    .parity-item p { margin: 5px 0 0; color: #798394; font-size: 7px; line-height: 1.45; }
    .empty-state { padding: 18px 12px; text-align: center; color: #7b8595; }
    .empty-state i { width: 34px; height: 34px; margin: 0 auto 8px; display: grid; place-items: center; border-radius: 11px; background: #edf1f6; font-style: normal; }
    .empty-state strong { display: block; color: #424d60; font-size: 9px; }

    @media (max-width: 1180px) {

    const query = new URLSearchParams(window.location.search);
    const state = { ...DEFAULT_STATE };
    let recoveryMessages = [];

    Object.keys(ALLOWED).forEach((key) => {
      const requested = query.get(key);
      if (requested && ALLOWED[key].includes(requested)) state[key] = requested;

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

                    <span class="task-tab active">콘텐츠 관리</span><span class="task-tab">장비 관리</span><span class="task-tab">키워드</span><span class="task-tab">분석</span>
                  </div>
                  <div class="task-toolbar">
                    <strong>콘텐츠 원장 · 684개</strong>
                    <div class="filter-pills"><span class="filter-pill active">노출</span><span class="filter-pill">숨김</span><span class="filter-pill">베스트</span><span class="filter-pill">미디어</span></div>
                  </div>
                  <div class="content-list">${renderContentRows(true)}</div>
                </div>
              </div>
            </section>
          </div>
        </div>
      `;
    }

    function renderMobileScene() {
      const role = SAMPLE_DATA.roles[state.role];
      const metrics = role.metrics.slice(0, 3).map(([label, value]) => `<div class="mobile-metric"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`).join("");
      const reviews = SAMPLE_DATA.content.slice(0, 3).map((item) => `
        <article class="mobile-review">
          <div class="mobile-review-head"><strong>${escapeHtml(item.author)}</strong><span>${escapeHtml(item.date)}</span></div>
          <p>${escapeHtml(item.text)}</p>
        </article>
      `).join("");
      return `
        <div class="preview-frame mobile-frame">
          <div class="preview-browser"><i class="browser-dot"></i><i class="browser-dot"></i><i class="browser-dot"></i><span>390 × 844 · mobile</span></div>
          <div class="mobile-product">
            <header class="mobile-header">
              <div class="hamburger" aria-label="메뉴 열기">☰</div>
              <div><strong>중앙 운영 공간</strong><span>${escapeHtml(role.label)} · ${escapeHtml(state.mode)}</span></div>
            </header>
            <div class="mobile-body">
              <div class="mobile-metrics">${metrics}</div>
              <section class="mobile-detail ${state.mode !== "baseline" ? "proposal-highlight" : ""}">
                <strong>중앙 운영 공간</strong><span>도시 중심권 · 메인 지점</span>
                <div class="mobile-status">
                  <div><small>장비 상태</small><b>연결 4 / 주의 1</b></div>
                  <div><small>최근 수집</small><b>방금 전</b></div>
                  <div><small>전체 콘텐츠</small><b>684</b></div>
                  <div><small>수집 대상</small><b>디스플레이 02</b></div>
                </div>
              </section>
              <div class="mobile-tabs"><span class="mobile-tab active">콘텐츠</span><span class="mobile-tab">장비</span><span class="mobile-tab">키워드</span><span class="mobile-tab">분석</span></div>
              <div class="mobile-filter"><span>필터 · 노출 / 베스트 / 미디어</span><span>⌄</span></div>
              <div class="mobile-review-list">${reviews}</div>
              <div class="mobile-pagination"><span class="page-dot">‹</span><span class="page-dot active">1</span><span class="page-dot">2</span><span class="page-dot">3</span><span class="page-dot">›</span></div>
            </div>
          </div>
        </div>
      `;
    }

    function compareMini(proposed) {
      return `
        <div class="compare-shell">
          <div class="compare-bar"></div>
          <div class="compare-content">
            <div class="skeleton-line short"></div><div class="skeleton-line"></div>
            <div class="compare-metrics ${proposed ? "proposed" : ""}"><div></div><div></div><div></div></div>
            <div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div>
          </div>
        </div>
      `;
    }

    function renderComparisonScene() {
      return `
        <div class="comparison-grid">
          <article class="compare-card">
            <header class="compare-head"><strong>Source-faithful baseline</strong><span class="source-tag">immutable</span></header>
            <div class="compare-mini">${compareMini(false)}</div>
            <div class="change-list">
              <div class="change-row"><b>현재</b><span>상태 지표가 작은 글씨로 이어져 역할과 의미 구분이 약합니다.</span></div>
              <div class="change-row"><b>근거</b><span>확인된 route, component, synthetic data 분포를 그대로 재현합니다.</span></div>
            </div>
          </article>
          <article class="compare-card">
            <header class="compare-head"><strong>Reviewed proposal R1</strong><span class="source-tag">proposed</span></header>
            <div class="compare-mini">${compareMini(true)}</div>
            <div class="change-list">
              <div class="change-row"><b>D-011</b><span>일반 사용자와 슈퍼 관리자의 요약 지표를 역할에 맞게 분리합니다.</span></div>
              <div class="change-row"><b>D-014</b><span>상세 높이를 줄이고 주요 콘텐츠가 첫 화면에서 더 많이 보이게 합니다.</span></div>
            </div>
          </article>
        </div>
      `;
    }

    function renderFinalScene() {
      const rows = SAMPLE_DATA.decisions.map((decision) => `
        <tr><td><strong>${escapeHtml(decision.id)}</strong></td><td>${escapeHtml(decision.title)}</td><td>${escapeHtml(decision.final)}</td><td><span class="status-pill match">integrated</span></td></tr>
      `).join("");
      const parity = SAMPLE_DATA.parity.map((item) => `
        <div class="parity-item"><div><strong>${escapeHtml(item.id)} · ${escapeHtml(item.title)}</strong><span class="status-pill ${escapeHtml(item.status)}">${escapeHtml(item.status)}</span></div><p>${escapeHtml(item.note)}</p></div>
      `).join("");
      const displayBody = state.unit === "display" ? `
        <div class="empty-state"><i>＋</i><strong>${escapeHtml(SAMPLE_DATA.empty_state.title)}</strong><p>${escapeHtml(SAMPLE_DATA.empty_state.body)}</p><button class="tiny-action primary" type="button">${escapeHtml(SAMPLE_DATA.empty_state.action)}</button></div>
      ` : parity;
      return `
        <div class="final-layout">
          <section class="final-hero">
            <div><p class="eyebrow" style="color:#84ddc8">Integrated final reference</p><h2>확정된 세부 결정을 전체 화면에 다시 병합</h2><p>${escapeHtml(SAMPLE_DATA.units[state.unit].focus)}</p></div>
            <div class="final-score"><strong>${SAMPLE_DATA.coverage.integrated}/${SAMPLE_DATA.coverage.required}</strong><span>decision coverage · missing ${SAMPLE_DATA.coverage.missing}</span></div>
          </section>
          <div class="final-panels">
            <section class="final-panel">
              <header class="final-panel-head"><strong>Final integration coverage</strong><span class="source-tag">100% linked</span></header>
              <table class="coverage-table">
                <thead><tr><th>결정</th><th>확정 내용</th><th>최종 위치</th><th>상태</th></tr></thead>
                <tbody>${rows}</tbody>
              </table>
            </section>
            <section class="final-panel">
              <header class="final-panel-head"><strong>${state.unit === "display" ? "Empty state example" : "Final ↔ actual parity"}</strong><span class="source-tag">verified</span></header>
              <div class="parity-list">${displayBody}</div>
            </section>
          </div>
          ${renderDesktopScene()}
        </div>
      `;
    }

    function renderEvidence() {
      const unit = SAMPLE_DATA.units[state.unit];
      const decisions = SAMPLE_DATA.decisions.filter((decision) => decision.unit === state.unit || state.unit === "overview");
      const decisionRows = (decisions.length ? decisions : SAMPLE_DATA.decisions.slice(0, 2)).map((decision) => `
        <div class="decision-row"><span class="decision-id">${escapeHtml(decision.id)}</span><span class="decision-copy">${escapeHtml(decision.title)}<br><small>${escapeHtml(decision.final)}</small></span><span class="decision-state">${escapeHtml(decision.state)}</span></div>
      `).join("");
      return `
        <section class="evidence-section">
          <div class="evidence-title"><h2>${escapeHtml(unit.label)}</h2><span class="source-tag">${escapeHtml(state.mode)}</span></div>
          <p class="subtle" style="margin-top:8px">${escapeHtml(unit.focus)}</p>
          <div class="evidence-list">
            <div class="evidence-card"><strong>정보 구조 렌즈</strong><p>${escapeHtml(SAMPLE_DATA.opinions.structure)}</p></div>
            <div class="evidence-card"><strong>인터랙션 렌즈</strong><p>${escapeHtml(SAMPLE_DATA.opinions.interaction)}</p></div>
            <div class="evidence-card"><strong>사용자 의견</strong><p>${escapeHtml(SAMPLE_DATA.opinions.user)}</p></div>
            <div class="evidence-card"><strong>디자인 리드 종합</strong><p>${escapeHtml(SAMPLE_DATA.opinions.lead)}</p></div>
          </div>
        </section>
        <section class="evidence-section">
          <div class="evidence-title"><h2>Decision history</h2><span class="source-tag">append-only</span></div>
          <div style="margin-top:7px">${decisionRows}</div>
        </section>
        <section class="evidence-section">
          <div class="evidence-title"><h2>Parity gate</h2><span class="source-tag">zero-gap</span></div>
          <div class="parity-summary"><div><strong>2</strong><span>match</span></div><div><strong>1</strong><span>approved</span></div><div><strong>0</strong><span>open gap</span></div></div>
          <p class="subtle" style="margin-top:9px">fixture_seed: ${escapeHtml(SAMPLE_DATA.fixture_seed)}<br>provenance: faithful-pattern + synthetic + proposed</p>
        </section>
      `;
    }

    function normalizeState(source) {
      const next = { ...source };
      let message = "";
      if (next.scene === "final" && next.mode !== "final") {
        next.mode = "final";
        message = "최종 통합 장면은 final 모드로 전환되었습니다.";
      }
      if (next.scene === "comparison" && next.mode === "final") {
        next.mode = "proposal-r1";
        message = "기준본 비교 장면은 proposal-r1 모드로 전환되었습니다.";
      }
      return { next, message };
    }

    function updateQuery() {
      const next = new URLSearchParams(state);
      history.replaceState(null, "", `${window.location.pathname}?${next.toString()}`);
    }

    function updateControls() {
      document.querySelectorAll("[data-scene]").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.scene === state.scene)));
      document.querySelectorAll("[data-role]").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.role === state.role)));
      document.querySelectorAll("[data-mode]").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.mode === state.mode)));
      document.querySelectorAll("[data-unit]").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.unit === state.unit)));
      document.body.dataset.activeScene = state.scene;
      document.body.dataset.activeRole = state.role;
      document.body.dataset.activeMode = state.mode;
      document.body.dataset.activeUnit = state.unit;
    }

    function render() {
      const normalized = normalizeState(state);
      Object.assign(state, normalized.next);
      const renderers = {
        desktop: renderDesktopScene,
        mobile: renderMobileScene,
        comparison: renderComparisonScene,
        final: renderFinalScene,
      };
      document.getElementById("preview-stage").innerHTML = renderers[state.scene]();
      document.getElementById("evidence-content").innerHTML = renderEvidence();
      updateControls();
      updateQuery();

      const note = document.getElementById("state-note");
      const messages = [...recoveryMessages, normalized.message].filter(Boolean);
      note.hidden = messages.length === 0;
      note.textContent = messages.join(" · ");
      recoveryMessages = [];
      document.getElementById("render-status").textContent = `${SAMPLE_DATA.roles[state.role].label}, ${state.scene}, ${state.mode}, ${SAMPLE_DATA.units[state.unit].label} 장면이 표시되었습니다.`;
    }

    document.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-scene], button[data-role], button[data-mode], button[data-unit]");
      if (!button) return;
      for (const key of Object.keys(ALLOWED)) {
        if (button.dataset[key]) state[key] = button.dataset[key];
      }
      render();
    });

    render();
  </script>
</body>
</html>
